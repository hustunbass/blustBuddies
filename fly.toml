# Fly.io config for the online battle server (see README "Online").
# Rooms live in memory, so run exactly ONE machine: fly deploy --ha=false
app = 'blast-buddies-server'
primary_region = 'fra'

[build]
  dockerfile = 'server.Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
